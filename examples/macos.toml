# Paths are relative to this TOML file. Generate mac-identity locally; short-code
# pairing will securely save the Windows certificate as windows-certificate.der.
[local]
name = "macbook"
listen = "0.0.0.0:43891"
certificate = "mac-identity/certificate.der"
private_key = "mac-identity/private-key.der"

[local.screen]
id = 2
name = "Mac display"
# Detect the complete active desktop at startup and after every reconnect.
auto = true

[peer]
address = "auto"
certificate = "windows-certificate.der"

[peer.screen]
id = 1
name = "Windows display"
# The trusted Windows peer supplies its current desktop geometry.
auto = true

[layout]
peer_on = "left"

[session]
hysteresis = 8
timeout_ms = 1500
connect_timeout_seconds = 30
# Kept in the shared configuration schema; only the Windows agent uses this.
windows_raw_input = true
