# Paths are relative to this TOML file. Generate windows-identity locally; short-code
# pairing will securely save the Mac's public certificate as mac-certificate.der.
[local]
name = "windows-pc"
listen = "0.0.0.0:43891"
certificate = "windows-identity/certificate.der"
private_key = "windows-identity/private-key.der"

[local.screen]
id = 1
name = "Windows display"
# Detect the complete active desktop at startup and after every reconnect.
auto = true

[peer]
address = "auto"
certificate = "mac-certificate.der"

[peer.screen]
id = 2
name = "Mac display"
# The trusted Mac peer supplies its current desktop geometry.
auto = true

[layout]
peer_on = "right"

[session]
hysteresis = 8
timeout_ms = 1500
connect_timeout_seconds = 30
