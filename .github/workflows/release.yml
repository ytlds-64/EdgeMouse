name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.15

            - 屏幕布局支持独立拖动每块显示器，像 Windows 显示设置一样排列；边缘自动吸附，穿越区域实时高亮。
            - Windows 可连接 Mac 上屏、下屏或同时连接两块屏幕，自动按接触边缘及重叠区域分配穿越位置。
            - 松手后自动保存并同步到另一台电脑；支持键盘微调、取消拖动、屏幕重叠保护与自动排列。
            - 显示器断开或几何变化后提示重新排列；布局只控制电脑间跨屏，不修改系统显示设置。
            - 请两台电脑均更新至 0.6.15。与旧版连接时仍保留原有整桌面边缘操作。

            Drag each display independently, with edge snapping and highlighted crossing segments. Connect Windows to the upper Mac display, the lower display, or both; touching edge overlap automatically determines where the pointer crosses. Releasing a drag saves and syncs the layout. Keyboard adjustments, drag cancellation, collision protection and automatic arrangement are included. Changed or disconnected displays require rearrangement. This virtual layout does not modify operating-system display settings. Update both computers to 0.6.15; older peers retain whole-desktop edge operation.

            注意：macOS 包继续使用临时签名，尚无 Developer ID 签名及 Apple 公证；更新后可能需要重新授予辅助功能权限。更新包签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed without Developer ID signing or Apple notarization. Updates may require Accessibility permission again; updater signature verification is separate from macOS application identity signing.

            Windows 下载 .exe 安装程序；macOS 下载通用版 .dmg，同时支持 Apple 芯片和 Intel Mac。已安装旧版时，可在“设置”或“关于”中检查更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
