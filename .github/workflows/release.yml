name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.14

            - 修复微信等软件复制图片时同时附带文件标记，导致 Mac/Windows 图片同步被跳过的问题。
            - 优先读取剪贴板中的真实图片；没有图片时仍忽略文件列表，不读取引用文件、不把文件路径作为文字发送。Mac 隐藏或临时内容仍会跳过。
            - 补充双方原生图片与文件标记共存的回归测试，以及 Windows 没有 PNG 格式时的传统位图兼容测试。
            - 请两台电脑均更新至 0.6.14，并在“设置 → 常规”保持“同步剪贴板”开启；连接后重新复制图片即可测试。

            Fixes image copies from WeChat and other applications being skipped on Mac/Windows when file metadata accompanies image pixels. Embedded images now take precedence; file-only copies and Mac concealed/transient content remain excluded. Referenced files are not opened or sent as text. Adds native mixed-format regression coverage on both platforms and a Windows legacy bitmap case without PNG. Update both computers to 0.6.14, keep clipboard synchronization enabled in Settings → General, then copy the image again while connected.

            文字上限 1 MiB；图片最多 16,777,216 像素、单边不超过 8192、PNG 压缩后不超过 16 MiB。超过限制的内容不会同步。

            Limits: 1 MiB UTF-8 text; images up to 16,777,216 pixels, 8192 per side and 16 MiB encoded PNG. Oversized content is skipped.

            注意：macOS 包继续使用临时签名，尚无 Developer ID 签名及 Apple 公证；更新后可能需要重新授予辅助功能权限。更新包签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed without Developer ID signing or Apple notarization. Updates may require Accessibility permission again; updater signature verification is separate from macOS application identity signing.

            Windows 下载 .exe 安装程序；macOS 下载通用版 .dmg，同时支持 Apple 芯片和 Intel Mac。已安装旧版时，可在“设置”或“关于”中检查更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
