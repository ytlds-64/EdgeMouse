name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.5

            - 修复鼠标正常返回与物理鼠标取回同时发生时服务退出的问题。
            - 会话异常时先释放按键和鼠标，再按设置自动重连。
            - 修复 Windows 任务栏和托盘图标被低分辨率缩略图放大导致的模糊；安装后通知系统刷新旧图标缓存。
            - 诊断包补充后台错误日志，并修复中文及省略号乱码。

            Fixes a control-handoff race that could stop the service, restores reconnect behavior after session errors, uses full-resolution Windows icons, refreshes shell icon caches on installation, and improves diagnostic logs.

            Windows 请下载 `.exe` 安装程序；macOS 请下载通用版 `.dmg`，同时支持 Apple 芯片和 Intel Mac。已安装旧版本时，也可以直接在 EdgeMouse 的“设置”或“关于”页面检查并安装更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
