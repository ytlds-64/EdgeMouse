name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.16

            - 单机预览和新“自动排列”改为居中，Mac 较窄的下屏位于上屏正下方。
            - 拖动靠近另一块屏幕的中心线时自动吸附，松手自动保存并同步。
            - 已保存布局继续保留；如果仍显示旧的侧边对齐布局，连接后点击“自动排列”即可使用居中排列。
            - 穿越仍按实际接触的高亮边缘计算；需要双屏同时接到 Windows 同一侧时，可手动将对应侧边对齐。
            - 修正停止测试的异步等待时序，不改变应用停止行为。

            Local-only previews and new automatic arrangements center displays, placing the narrower lower Mac screen beneath the upper one. Dragging near a display midpoint snaps to the centerline and saves on release. Existing layouts remain intact; click Arrange automatically while connected to apply centered positions. Crossings still follow touching highlighted edges, and manually aligning side edges can connect both Mac screens to the same Windows edge. The stop regression test now waits for its asynchronous flag; application shutdown behavior is unchanged.

            建议两台电脑均更新至 0.6.16。Update both computers to 0.6.16 for the same layout controls.

            注意：macOS 包继续使用临时签名，尚无 Developer ID 签名及 Apple 公证；更新后可能需要重新授予辅助功能权限。更新包签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed without Developer ID signing or Apple notarization. Updates may require Accessibility permission again; updater signature verification is separate from macOS application identity signing.

            Windows 下载 .exe 安装程序；macOS 下载通用版 .dmg，同时支持 Apple 芯片和 Intel Mac。已安装旧版时，可在“设置”或“关于”中检查更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
