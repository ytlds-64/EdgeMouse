name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.10

            - 修复 Windows Raw Input 漏掉自注入事件过滤的问题，避免 Mac 远程移动被误当成 Windows 本机鼠标抢回控制，导致竖屏中途跳回 Mac。
            - 在更新绝对坐标参考点前过滤整个自注入事件包，覆盖移动、按键和滚轮；保留正常鼠标及无设备句柄的精密触控板输入。
            - 增加真实 Windows SendInput / Raw Input / 鼠标钩子联动回归测试，核对上下移动期间的系统实际落点和捕获结果。
            - 抢回控制日志增加触发事件及接收端坐标，便于继续定位具体硬件或驱动差异。
            - 保留 0.6.9 的鼠标速度调节和同步；本次关键修复在 Windows 端。

            Fixes missing self-injection filtering in Windows Raw Input, which could treat Mac-driven remote motion as a local physical reclaim and jump back mid-screen. Rejects complete marked packets before updating absolute-device baselines, without rejecting real mice or precision touchpads with null device handles. Adds a native Windows SendInput/capture regression test, visible-cursor checks and detailed reclaim diagnostics. Pointer speed controls and synchronization remain available. The critical fix is on the Windows receiver.

            注意：当前 macOS 包仍使用临时签名，尚无 Developer ID 签名及 Apple 公证；跨版本更新后，系统仍可能要求重新授权。此修复不会绕过、删除或重置系统隐私权限。更新包的加密签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed, without Developer ID signing or Apple notarization. macOS may require Accessibility permission again after an update. This release does not bypass or reset privacy permissions; updater signature verification is separate from macOS application identity signing.

            Windows 请下载 `.exe` 安装程序；macOS 请下载通用版 `.dmg`，同时支持 Apple 芯片和 Intel Mac。已安装旧版本时，也可以直接在 EdgeMouse 的“设置”或“关于”页面检查并安装更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
