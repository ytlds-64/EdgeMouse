name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.12

            - 移除概览、输入、屏幕布局和桌面设置的保存按钮，修改后自动保存、应用，下次启动直接恢复。
            - 鼠标速度与平滑度滑块在调整完成后应用；选择布局方向立即应用，拖动屏幕卡片只在松手后提交，取消拖动不改变布局。
            - 连续修改按顺序保存，两个控制方向各自独立；延迟返回的旧状态不会覆盖新选择。
            - 保存失败时明确提示并提供重试；配置加载和恢复默认设置期间保护正在进行的操作。
            - Windows 接收端使用系统注入标志过滤合成鼠标事件，避免无本程序标记的合成移动误触发本机鼠标抢回；切换定位也统一使用带标记的事件。
            - 两端均更新至 0.6.12，即可在两台电脑上使用自动保存界面。离线修改会保留，连接后自动同步。

            Settings now save and apply automatically across Overview, Input, Screen Layout and desktop preferences, and persist between launches. Sliders apply when adjustment ends; direction selection applies immediately, while layout dragging commits only on release and cancellation leaves the layout unchanged. Writes are serialized, control directions remain independent, and stale status responses cannot overwrite newer edits. Failed saves offer retry, with guards during initial loading and reset. Update both computers to use the new interface on both devices; offline changes synchronize when connected. The Windows receiver also rejects synthetic mouse motion using Windows' injected-event flag, and handoff pointer positioning uses marked injection.

            注意：当前 macOS 包仍使用临时签名，尚无 Developer ID 签名及 Apple 公证；跨版本更新后，系统仍可能要求重新授权。此修复不会绕过、删除或重置系统隐私权限。更新包的加密签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed, without Developer ID signing or Apple notarization. macOS may require Accessibility permission again after an update. This release does not bypass or reset privacy permissions; updater signature verification is separate from macOS application identity signing.

            Windows 请下载 `.exe` 安装程序；macOS 请下载通用版 `.dmg`，同时支持 Apple 芯片和 Intel Mac。已安装旧版本时，也可以直接在 EdgeMouse 的“设置”或“关于”页面检查并安装更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
