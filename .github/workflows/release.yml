name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.17

            - 增强操作过程中突然断线的诊断，记录连接建立及异常结束的精确时间。
            - 分别记录心跳接收、输入处理、发送等待与底层连接计数，保留完整 QUIC 错误原因。
            - 只记录诊断元数据，不记录键盘输入、剪贴板或屏幕内容。
            - 本次保持现有心跳超时与本机输入恢复行为；间歇断连尚未确认修复。
            - 请 Mac 与 Windows 均更新至 0.6.17；再次中断后，尽快导出两端诊断包。

            Adds timestamped diagnostics for disconnections during active use, including heartbeat receipt, input-loop processing, pending writes, connection counters and underlying QUIC error causes. Only timing, counter and error metadata are recorded. Heartbeat deadlines and input recovery behavior remain unchanged; the intermittent disconnection is not yet confirmed fixed. Update both computers to 0.6.17, then export diagnostics from both shortly after the next occurrence.

            注意：macOS 包继续使用临时签名，尚无 Developer ID 签名及 Apple 公证；更新后可能需要重新授予辅助功能权限。更新包签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed without Developer ID signing or Apple notarization. Updates may require Accessibility permission again; updater signature verification is separate from macOS application identity signing.

            Windows 下载 .exe 安装程序；macOS 下载通用版 .dmg，同时支持 Apple 芯片和 Intel Mac。已安装旧版时，可在“设置”或“关于”中检查更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
