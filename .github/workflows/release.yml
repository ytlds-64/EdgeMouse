name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.11

            - 开启“本机鼠标优先”后，移动被控电脑的真实鼠标即可立即恢复本机操作，不再需要推向边缘或等待对端确认。
            - 等待确认时过滤迟到的远程鼠标、键盘和移动数据；保留本机拖拽保护，超时安全重连，确认到达后不会重新移动光标或强制反向跨屏。
            - Mac 交还控制时清理已经松开的残留按键，保留真正长按的安全隔离，避免首次新按键被误吞。
            - Mac 返回时取消尚未播放的远程平滑移动，并为原应用、原窗口内的已有输入框增加焦点恢复保护。
            - 焦点恢复不激活其他应用、不模拟点击、不读取输入内容；已切换到其他输入框或窗口时不会抢回旧焦点。不支持相关辅助功能接口的应用会安全跳过。
            - 请两台电脑均更新至 0.6.11，以获得完整修复。

            Local mouse priority now restores the receiver's local input before sending a reclaim request, regardless of movement direction or network latency. Late remote input is fenced until acknowledgement or normal handback, preserving local drag safety. Mac handback reconciles released keys without leaking held autorepeat, cancels pending remote smoothing, and adds guarded restoration of an existing editable responder in the unchanged foreground app/window. It never activates another app, synthesizes a click, or reads text. Update both computers for all fixes.

            注意：当前 macOS 包仍使用临时签名，尚无 Developer ID 签名及 Apple 公证；跨版本更新后，系统仍可能要求重新授权。此修复不会绕过、删除或重置系统隐私权限。更新包的加密签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed, without Developer ID signing or Apple notarization. macOS may require Accessibility permission again after an update. This release does not bypass or reset privacy permissions; updater signature verification is separate from macOS application identity signing.

            Windows 请下载 `.exe` 安装程序；macOS 请下载通用版 `.dmg`，同时支持 Apple 芯片和 Intel Mac。已安装旧版本时，也可以直接在 EdgeMouse 的“设置”或“关于”页面检查并安装更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
