name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.2 修复安装版首次运行时缺少旧配对证书而无法启动的问题，新增旧配对配置的一次性导入，并修正错误提示图标比例与长文本显示。

            Windows 请下载 `.exe` 安装程序；macOS 请下载通用版 `.dmg`，同时支持 Apple 芯片和 Intel Mac。升级后可在“连接”页面选择“导入旧配对配置…”，两台电脑各导入一次原来的 `edgemouse.toml`，以后更新将保留配对关系。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
