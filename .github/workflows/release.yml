name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.13

            - 修复 macOS 后台跨屏服务重复占用 Dock 图标，服务继续在后台运行。
            - 关闭窗口后可以再次打开并恢复原窗口；最小化和重复启动会唤起已有窗口。
            - 完整退出应用时同时停止跨屏服务；关闭“关闭窗口后继续运行”后，关闭窗口即退出。
            - 新增文字和图片剪贴板双向同步，在“设置 → 常规”中开启，修改自动保存。两台电脑均需更新至 0.6.13 并开启同步。
            - 仅同步连接期间新复制的内容，不补发连接前、断线或停用期间的旧剪贴板；支持文字及保留透明度的图片，不同步文件。
            - 内容通过现有配对加密连接的独立低优先级流传输；限制传输尺寸，避免剪贴板读写和图片处理阻塞鼠标控制。程序不记录或保存剪贴板正文。

            Fixes the extra macOS Dock icon and restores the existing window when the app is reopened or launched again. Quitting the app now cleans up its background service; closing a window exits fully when background running is disabled. Adds bidirectional text and image clipboard synchronization with an automatically saved switch in Settings → General. Update both computers to 0.6.13 and enable synchronization. Only newly copied content while connected is shared; previous, disconnected and disabled-period contents are not replayed. File copying is not supported. Clipboard data uses a separate low-priority stream over the existing authenticated connection, with size limits and no payload logging or persistence.

            文字上限 1 MiB；图片最多 16,777,216 像素、单边不超过 8192、PNG 压缩后不超过 16 MiB。超过限制的内容不会同步。

            Limits: 1 MiB UTF-8 text; images up to 16,777,216 pixels, 8192 per side and 16 MiB encoded PNG. Oversized content is skipped.

            注意：macOS 包继续使用临时签名，尚无 Developer ID 签名及 Apple 公证；更新后可能需要重新授予辅助功能权限。更新包签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed without Developer ID signing or Apple notarization. Updates may require Accessibility permission again; updater signature verification is separate from macOS application identity signing.

            Windows 下载 .exe 安装程序；macOS 下载通用版 .dmg，同时支持 Apple 芯片和 Intel Mac。已安装旧版时，可在“设置”或“关于”中检查更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
