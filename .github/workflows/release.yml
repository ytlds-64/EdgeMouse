name: Build installers and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            sidecar: universal-apple-darwin
          - platform: windows-2022
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets for macOS Universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare bundled background service on macOS
        if: runner.os == 'macOS'
        run: ./scripts/prepare-sidecar-macos.sh "${{ matrix.sidecar }}"

      - name: Prepare bundled background service on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-sidecar-windows.ps1 -TargetTriple "${{ matrix.sidecar }}"

      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/edgemouse-desktop
          tagName: v__VERSION__
          releaseName: EdgeMouse __VERSION__
          releaseBody: |
            EdgeMouse 0.6.7

            - 修复 macOS 连接成功后因输入权限或捕获初始化错误而退出后台服务的问题。
            - 未获辅助功能权限时保持服务开启并显示“等待授权”；系统认可授权后自动继续连接。
            - 连接、开关与诊断恢复操作加互斥保护；启动或重连过程中重复点击不会停止当前服务。
            - 原生输入后端准备完成后才报告“已连接”，避免仅完成 TLS 握手就误报可用。
            - 修复诊断列表标题被挤成竖排的问题。

            Keeps the macOS service alive while waiting for Accessibility permission or retrying native input initialization. Connection resumes when the OS reports permission granted. Serializes service operations and ignores duplicate connect requests during startup/reconnection. Reports connected only after input backends are ready, and fixes diagnostic list alignment.

            注意：当前 macOS 包仍使用临时签名，尚无 Developer ID 签名及 Apple 公证；跨版本更新后，系统仍可能要求重新授权。此修复不会绕过、删除或重置系统隐私权限。更新包的加密签名验证与 macOS 应用身份签名是两回事。

            macOS packages remain ad-hoc signed, without Developer ID signing or Apple notarization. macOS may require Accessibility permission again after an update. This release does not bypass or reset privacy permissions; updater signature verification is separate from macOS application identity signing.

            Windows 请下载 `.exe` 安装程序；macOS 请下载通用版 `.dmg`，同时支持 Apple 芯片和 Intel Mac。已安装旧版本时，也可以直接在 EdgeMouse 的“设置”或“关于”页面检查并安装更新。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the actual Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Version $version
