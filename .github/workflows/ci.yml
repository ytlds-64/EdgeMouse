name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            binary: target/release/edgemouse
            desktop_binary: target/release/edgemouse-desktop
            example: examples/macos.toml
          - name: Windows
            os: windows-2022
            binary: target/release/edgemouse.exe
            desktop_binary: target/release/edgemouse-desktop.exe
            example: examples/windows.toml

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check macOS launcher syntax
        if: runner.os == 'macOS'
        run: bash -n scripts/run-macos-with-log.sh scripts/manage-autostart-macos.sh

      - name: Check Windows launcher syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scriptPaths = @(
            'scripts/run-windows-with-log.ps1',
            'scripts/update-build-run-windows.ps1',
            'scripts/build-run-desktop-windows.ps1',
            'scripts/manage-autostart-windows.ps1'
          )
          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptPath),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run static analysis
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release executables
        run: cargo build --release -p edgemouse-agent -p edgemouse-desktop

      - name: Upload runnable package
        uses: actions/upload-artifact@v4
        with:
          name: edgemouse-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            ${{ matrix.binary }}
            ${{ matrix.desktop_binary }}
            ${{ matrix.example }}
            docs/EdgeMouse-Test-Guide.docx
            scripts/run-macos-with-log.sh
            scripts/run-windows-with-log.ps1
            scripts/update-build-run-windows.ps1
            scripts/build-run-desktop-windows.ps1
            scripts/manage-autostart-macos.sh
            scripts/manage-autostart-windows.ps1
            README.md
