[package]
name = "edgemouse-agent"
description = "Background agent and diagnostics CLI for EdgeMouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "edgemouse"
path = "src/main.rs"

[dependencies]
edgemouse-core = { path = "../edgemouse-core" }
edgemouse-protocol = { path = "../edgemouse-protocol" }
edgemouse-transport = { path = "../edgemouse-transport" }
ctrlc = { version = "3.4.7", features = ["termination"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
spake2 = { version = "0.5.0-pre.0", features = ["getrandom", "std"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
edgemouse-platform-macos = { path = "../edgemouse-platform-macos" }
libc = "0.2.189"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

[target.'cfg(target_os = "windows")'.dependencies]
edgemouse-platform-windows = { path = "../edgemouse-platform-windows" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
clipboard-win = "5.4"

[lints]
workspace = true
